<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PicturaBox — browser-only image resize, format conversion, and batch export. Runs entirely on your device with no uploads." />
  <title>PicturaBox</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f4f6fa;
      --surface: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0ea5e9;
      --accent-strong: #0284c7;
      --accent-soft: #e0f2fe;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --danger: #b91c1c;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 12px;
    }
    :root[data-theme='dark'] {
      --bg: #0b1220;
      --bg-secondary: #111c2e;
      --surface: #131f33;
      --fg: #e7edf5;
      --muted: #93a4b8;
      --border: #263449;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --accent-soft: #0c2a3a;
      --warn: #fcd34d;
      --warn-bg: #2a2312;
      --warn-border: #4a3d1a;
      --ok: #4ade80;
      --ok-bg: #0f2a19;
      --danger: #f87171;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1240px; margin: 0 auto; padding: 16px 20px 48px; }
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px; height: 44px; flex: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      display: grid; place-items: center;
      box-shadow: var(--shadow);
    }
    .logo svg { width: 26px; height: 26px; display: block; }
    .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
    .header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
    .privacy {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--ok-bg); color: var(--ok);
      border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
      white-space: nowrap;
    }
    .privacy svg { width: 14px; height: 14px; }
    .hidden { display: none !important; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; margin: 16px 0;
      box-shadow: var(--shadow);
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row.stack { flex-direction: column; align-items: stretch; gap: 6px; }
    input[type='number'], input[type='text'], select {
      background: var(--bg); color: var(--fg); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 9px; font-size: 14px; min-width: 84px;
      font-family: inherit;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    input[type='range'] { accent-color: var(--accent); }
    .btn {
      font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      border-radius: 8px; padding: 8px 14px; transition: background 0.12s, border-color 0.12s, opacity 0.12s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .lock { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
    .lock input { accent-color: var(--accent); }
    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .segmented button {
      border: none; background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; font-weight: 600;
      padding: 7px 12px; cursor: pointer;
    }
    .segmented button.active { background: var(--accent-soft); color: var(--accent-strong); }
    .qlabel { font-size: 13px; font-weight: 600; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; color: var(--muted); }
    .dropzone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      background: var(--surface); padding: 44px 20px; text-align: center;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.dragging { border-color: var(--accent); background: var(--accent-soft); }
    .dropzone .dz-icon { width: 52px; height: 52px; margin: 0 auto 12px; opacity: 0.8; }
    .dropzone h2 { margin: 0 0 6px; font-size: 16px; }
    .dropzone p { margin: 0; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 6px; }
    .thumb-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    }
    .thumb-media {
      position: relative; aspect-ratio: 1 / 1; background: var(--bg-secondary); cursor: pointer;
      display: grid; place-items: center; overflow: hidden;
    }
    .thumb-media img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .thumb-media .crop-hint {
      position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
      background: rgba(14, 165, 233, 0.15); color: var(--accent-strong); font-size: 12px; font-weight: 600;
      transition: opacity 0.12s; pointer-events: none;
    }
    .thumb-media:hover .crop-hint { opacity: 1; }
    .thumb-info { padding: 9px 10px 10px; }
    .thumb-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thumb-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge.fmt { background: var(--accent-soft); color: var(--accent-strong); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .thumb-actions { display: flex; gap: 6px; padding: 0 10px 10px; }
    .thumb-actions .btn { flex: 1; padding: 6px 8px; font-size: 12px; }
    .progress-wrap { margin: 16px 0; }
    .progress-bar { height: 10px; background: var(--bg-secondary); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #6366f1); width: 0%; transition: width 0.15s ease; }
    .progress-label { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .bulk { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-top: 16px; }
    .bulk h3 { margin: 0 0 8px; font-size: 14px; }
    .bulk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 240px; overflow: auto; }
    .bulk-list li { font-size: 12.5px; display: flex; justify-content: space-between; gap: 10px; }
    .toast { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
    .toast.ok { background: var(--ok-bg); border-color: var(--border); color: var(--ok); }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
      display: grid; place-items: center; padding: 16px; z-index: 50;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 640px; width: 100%; padding: 16px;
    }
    .modal h3 { margin: 0 0 4px; }
    .crop-stage { position: relative; margin: 12px 0; background: var(--bg-secondary); border-radius: 8px; overflow: hidden; user-select: none; touch-action: none; }
    .crop-stage img { display: block; max-width: 100%; height: auto; pointer-events: none; }
    .crop-rect { position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); cursor: move; }
    .crop-rect::after { content: ''; position: absolute; inset: -4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    footer.app-footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    footer.app-footer a { color: var(--accent-strong); text-decoration: none; }
    @media (max-width: 768px) {
      .container { padding: 12px 14px 40px; }
      .header h1 { font-size: 20px; }
      .toolbar { gap: 12px; }
      .field { flex: 1 1 140px; }
      .segmented button { padding: 6px 9px; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .header p { max-width: none; }
      .btn { padding: 7px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <header class="header" id="header"></header>
    <div class="toolbar" id="toolbar"></div>
    <div id="dropzone"></div>
    <div id="progress" class="progress-wrap hidden"></div>
    <div class="grid" id="grid"></div>
    <div id="bulk" class="hidden"></div>
    <div id="footer" class="app-footer"></div>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

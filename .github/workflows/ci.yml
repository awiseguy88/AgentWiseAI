name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Agent Done Claim Verifier
        working-directory: agent-done-claim-verifier
        run: npm test

      - name: Agent Drift Monitor
        working-directory: agent-drift-monitor
        run: npm test

      - name: Agent Reliability Logbook
        working-directory: agent-reliability-logbook
        run: node test/smoke.mjs

      - name: AI Feature Usage Auditor
        working-directory: ai-feature-usage-auditor
        run: node smoke-check.mjs

      - name: Glide Classic Escape Kit
        working-directory: glide-classic-escape-kit
        run: npm test

      - name: Model API Watch
        working-directory: model-api-watch
        run: npm test

      - name: PR Review Cost Guard
        working-directory: pr-review-cost-guard
        run: npm test

      - name: Solo Site Rescue Kit
        working-directory: solo-site-rescue-kit
        run: npm run smoke

      - name: Install Tool Launcher dependencies
        working-directory: tool-launcher
        run: npm ci

      - name: Tool Launcher
        working-directory: tool-launcher
        run: npm test

      - name: Vibe-Coded App Doctor
        working-directory: vibe-coded-app-doctor
        run: npm test

      - name: MCP Lemonade Server
        working-directory: mcp-lemonade-server
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: DEEPFIELD
        working-directory: deepfield
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: FitFrame
        working-directory: products/fitframe
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Schedule Cadence Lab
        working-directory: products/schedule-cadence-lab
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: TokenScope
        working-directory: products/token-scope
        run: |
          npm ci
          npm run build
          npm test

      - name: PixTrim Lab
        working-directory: products/pixtrim-lab
        run: |
          npm ci
          npm run build
          npm test

      - name: PicturaBox
        working-directory: products/picturabox
        run: |
          npm ci
          npm run build
          npm test

      - name: TinySqueeze
        working-directory: products/tinysqueeze
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Chmod Lab
        working-directory: products/chmod-lab
        run: |
          npm ci
          npm run build
          npm test

      - name: Base64 Bridge
        working-directory: products/base64-bridge
        run: |
          npm ci
          npm run build
          npm test

      - name: Goodhart's Law in Evolution
        working-directory: experiments/goodharts-law-evolution
        run: |
          python -m pip install --quiet numpy
          python run.py --N 5000 --mus "1.0" --gammas "0.1,0.3,0.5,0.7,0.9" --runs 1 --gens-v 30 --no-plot
          python test_smoke.py

      - name: Model Alias Drift Guard
        working-directory: model-alias-drift-guard
        run: npm test

      - name: Inbox Agent Coverage Guard
        working-directory: inbox-agent-coverage-guard
        run: |
          npm ci
          npm test

      - name: SIS Epidemic Threshold
        working-directory: experiments/sis-epidemic-threshold
        run: |
          python -m pip install --quiet numpy networkx
          python test_smoke.py

      - name: Domination-versus-Edge-Domination (50-vertex cubic counterexample)
        working-directory: experiments/domination-edge-domination-order50
        run: python test_smoke.py
